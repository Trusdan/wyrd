name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    # Pinned until ubuntu-26.04 is deliberately validated. Baselines are recorded per image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor script smoke
        run: tools/vendor_wyrd_smoke.sh

      - name: Install pinned Godot
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          mkdir -p "$HOME/.local/bin" /tmp/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot-bin
          install -m 0755 "/tmp/godot-bin/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          godot --version

      - name: Import and test
        run: tools/run_tests.sh

      - name: Check example content
        run: godot --headless --path . -s res://addons/wyrd/cli/wyrd_cli.gd -- check example/content

      - name: Check Gullhaven manifest
        run: godot --headless --path . -s res://addons/wyrd/cli/wyrd_cli.gd -- check --manifest example/content/gullhaven/harbor.wyrdmanifest.tres

      - name: Watch smoke
        run: tools/watch_smoke.sh

      - name: POT check
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          set +o pipefail
          msgfmt --version | head -1
          status=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          godot --headless --path . -s res://addons/wyrd/cli/wyrd_cli.gd -- pot --manifest example/content/gullhaven/harbor.wyrdmanifest.tres --out "$RUNNER_TEMP/wyrd.pot"
          msgfmt --check -o /dev/null "$RUNNER_TEMP/wyrd.pot"

      - name: Export JSON is stable
        run: |
          set -euo pipefail
          godot --headless --path . -s res://addons/wyrd/cli/wyrd_cli.gd -- \
            export-json --manifest example/content/gullhaven/harbor.wyrdmanifest.tres -o /tmp/wyrd-export-a.json
          godot --headless --path . -s res://addons/wyrd/cli/wyrd_cli.gd -- \
            export-json --manifest example/content/gullhaven/harbor.wyrdmanifest.tres -o /tmp/wyrd-export-b.json
          diff -q /tmp/wyrd-export-a.json /tmp/wyrd-export-b.json

      - name: Benchmark (informational)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          godot --headless --path . -s res://tests/bench/bench.gd -- \
            --iterations 2000 --out res://tests/bench/out/ci.json
          cat tests/bench/out/ci.json

      - name: Stage coverage file
        if: always()
        run: |
          set -euo pipefail
          src="${HOME}/.local/share/godot/app_userdata/Wyrd/wyrd_coverage.json"
          mkdir -p coverage-artifact
          if [[ -f "$src" ]]; then
            cp "$src" coverage-artifact/wyrd_coverage.json
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyrd-coverage
          path: coverage-artifact/wyrd_coverage.json
          if-no-files-found: ignore

      - name: Content hygiene
        if: always()
        env:
          WYRD_HYGIENE_DENYLIST: ${{ secrets.WYRD_HYGIENE_DENYLIST }}
        run: tools/content_hygiene.sh "origin/${{ github.base_ref || 'main' }}"

  vscode:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node pin
        id: node
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/pins.env
          echo "version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: tools/vscode-wyrd/package-lock.json

      - name: Install extension dependencies
        working-directory: tools/vscode-wyrd
        run: npm ci

      - name: Grammar snapshots
        working-directory: tools/vscode-wyrd
        run: npx vscode-tmgrammar-snap 'tests/snap/*.wyrd'

      - name: Package VSIX
        working-directory: tools/vscode-wyrd
        run: npx vsce package --out wyrd.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: wyrd-vscode-vsix
          path: tools/vscode-wyrd/wyrd.vsix
          if-no-files-found: error
